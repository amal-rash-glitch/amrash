<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AmRash | تسجيل الدخول</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap">

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

  <div class="login-wrapper">

    <div class="login-brand">
      <div class="brand-content">

        <div class="brand-logo">
          <i class="bi bi-hospital"></i>
        </div>

        <h1 class="brand-title">AmRash</h1>

        <p class="brand-subtitle">
          نظام إدارة طبية وإدارية متكامل
        </p>

        <ul class="brand-features">
          <li>
            <i class="bi bi-check-circle-fill"></i>
            إدارة المرضى والملفات الطبية
          </li>

          <li>
            <i class="bi bi-check-circle-fill"></i>
            جدولة المواعيد ومتابعتها
          </li>

          <li>
            <i class="bi bi-check-circle-fill"></i>
            إدارة الأطباء والأقسام
          </li>

          <li>
            <i class="bi bi-check-circle-fill"></i>
            تقارير وإحصائيات فورية
          </li>
        </ul>

      </div>

      <div class="brand-footer">
        © <span id="year"></span> AmRash — جميع الحقوق محفوظة
      </div>
    </div>


    <div class="login-form-side">

      <div class="login-form-box">

        <div class="form-head">
          <h2>تسجيل الدخول</h2>
          <p>أدخل بياناتك للوصول إلى لوحة التحكم</p>
        </div>


        <div id="loginAlert"
             class="alert alert-danger d-none"
             role="alert">

          <i class="bi bi-exclamation-triangle-fill me-2"></i>

          <span id="loginAlertText"></span>

        </div>


        <form id="loginForm" novalidate>

          <div class="mb-3">

            <label for="email" class="form-label">
              البريد الإلكتروني
            </label>

            <div class="input-icon-group">

              <i class="bi bi-envelope"></i>

              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="admin@amrash.com"
                autocomplete="username"
                required
              >

            </div>

            <div
              class="invalid-feedback"
              id="emailError">
            </div>

          </div>


          <div class="mb-3">

            <label for="password" class="form-label">
              كلمة المرور
            </label>

            <div class="input-icon-group">

              <i class="bi bi-lock"></i>

              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                class="btn-toggle-pass"
                id="togglePass"
                aria-label="إظهار كلمة المرور">

                <i
                  class="bi bi-eye"
                  id="togglePassIcon">
                </i>

              </button>

            </div>

            <div
              class="invalid-feedback"
              id="passwordError">
            </div>

          </div>


          <div class="d-flex justify-content-between align-items-center mb-4">

            <div class="form-check">

              <input
                class="form-check-input"
                type="checkbox"
                id="rememberMe"
              >

              <label
                class="form-check-label"
                for="rememberMe">
                تذكرني
              </label>

            </div>

            <a
              href="#"
              class="link-muted"
              onclick="return false;">
              نسيت كلمة المرور؟
            </a>

          </div>


          <button
            type="submit"
            class="btn btn-primary btn-login w-100"
            id="loginBtn">

            <span class="btn-text">
              دخول
            </span>

            <span
              class="spinner-border spinner-border-sm d-none"
              id="loginSpinner">
            </span>

          </button>

        </form>

      </div>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/app.js"></script>


  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();


  </script>

</body>
</html>
